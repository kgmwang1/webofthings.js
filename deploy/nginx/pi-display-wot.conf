# Install in nginx's http context after replacing @...@ deployment placeholders.
# The application must remain bound to 127.0.0.1; do not trust forwarded client headers.
limit_conn_zone $binary_remote_addr zone=pi_display_connections:1m;
limit_req_zone $binary_remote_addr zone=pi_display_requests:1m rate=1r/s;

server {
    listen @BIND_ADDRESS@:@PORT@ ssl;
    server_name @TLS_SERVER_NAME@;

    ssl_certificate @TLS_CERT_PATH@;
    ssl_certificate_key @TLS_KEY_PATH@;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    limit_conn pi_display_connections 8;
    limit_req zone=pi_display_requests burst=20 nodelay;

    location / {
        proxy_pass https://127.0.0.1:8484;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_ssl_name @TLS_SERVER_NAME@;
        proxy_ssl_server_name on;
        proxy_ssl_trusted_certificate @TLS_CERT_PATH@;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 1;
    }
}