name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run audit:ci

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks:v8.28.0
          dir /repo --no-banner --redact --exit-code 1