name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      appliance_target:
        description: SSH alias configured on the appliance controller
        required: false
        type: string
      appliance_model:
        description: Raspberry Pi model gate
        required: false
        type: choice
        options:
          - pi4
          - pi5

permissions:
  contents: read

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run audit:ci

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks:v8.28.0
          dir /repo --no-banner --redact --exit-code 1

  release-baseline:
    name: Reproducible release baseline
    needs: [validate, dependencies, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:forbidden
      - name: Generate release twice
        run: |
          npm run release -- "$RUNNER_TEMP/release-a"
          npm run release -- "$RUNNER_TEMP/release-b"
      - name: Compare and verify release outputs
        run: |
          diff -u "$RUNNER_TEMP/release-a/SHA256SUMS" "$RUNNER_TEMP/release-b/SHA256SUMS"
          node scripts/verify-release.cjs "$RUNNER_TEMP/release-a"
          node scripts/verify-release.cjs "$RUNNER_TEMP/release-b"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-display-wot-release-baseline
          path: ${{ runner.temp }}/release-a/
          if-no-files-found: error
          retention-days: 30

  arm64-package:
    name: Linux ARM64 package and appliance contracts
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --run test/contract test/integration/lifecycle.test.ts
      - run: bash -n scripts/*.sh
      - run: |
          sudo groupadd --system pi-display-wot
          sudo useradd --system --gid pi-display-wot --home-dir /var/lib/pi-display-wot --shell /usr/sbin/nologin pi-display-wot
          sudo PI_DISPLAY_SERVICE_USER=pi-display-wot PI_DISPLAY_SERVICE_GROUP=pi-display-wot bash scripts/test-package-lifecycle.sh

  appliance-gate:
    name: External ${{ inputs.appliance_model }} power and soak gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.appliance_target != ''
    runs-on:
      group: appliance-controllers
      labels: [self-hosted, linux, ARM64]
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - name: Run physical appliance gate
        env:
          DHCP_CHANGE_COMMAND: /usr/local/bin/pi-dhcp-change
          POWER_CYCLE_COMMAND: /usr/local/bin/pi-power-cycle
          POWER_CYCLES: 5
          SOAK_SECONDS: 86400
        run: >-
          bash scripts/appliance-test.sh
          '${{ inputs.appliance_target }}'
          '${{ inputs.appliance_model }}'